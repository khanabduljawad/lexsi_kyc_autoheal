[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexsi-kyc-autoheal"
version = "0.2.0"
description = "AutoHeal-KYC: Self-Healing FinCEN/FATF/OFAC Compliance & Tool-Calling Agent built on CuratorKIT, AgentTune, and AuditKIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agenttune>=1.1.3",
    "auditkit>=1.1.6",
    "curatorkit>=0.1.25",
    "faker>=24.0.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.20.0",
    "pyyaml>=6.0",
    "datasets>=2.18.0",
    "huggingface_hub>=0.24.0",
    "litellm>=1.40.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.4.0",
    "transformers>=5.15,<6",
    "trl==1.7.1",
    "peft>=0.15.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.43.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
